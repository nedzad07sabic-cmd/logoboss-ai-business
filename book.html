<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book online · LOGO BOSS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#08090b;color:#f6f3eb;font-family:Arial}.w{max-width:650px;margin:auto;padding:28px 18px}.box{background:#111318;border:1px solid #2c2e34;border-radius:18px;padding:22px;margin:14px 0}.gold{color:#d8ad55}input,select,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #373941;background:#17191e;color:white}button{background:#d8ad55;color:#111;font-weight:900;cursor:pointer}.hide{display:none}.ok{border-color:#5d9f67}</style></head><body><div class="w"><h1>LOGO <span class="gold">BOSS</span></h1><div id="loading" class="box">Loading booking page…</div><div id="booking" class="box hide"><h2 id="business"></h2><p>Book an appointment online</p><select id="service"></select><input id="date" type="date" required><input id="time" type="time" required><input id="name" placeholder="Your name" required><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="Phone / WhatsApp"><textarea id="note" placeholder="Note"></textarea><button id="send">Request appointment</button><p id="msg"></p></div></div><script>
const sb=supabase.createClient('https://ppmefffjhqpmrjnlewoq.supabase.co','sb_publishable_TcFfVY1GiPZOufw6tQDh1A_vWoS2dsO'),$=x=>document.getElementById(x);let biz,services=[];
async function init(){let slug=new URLSearchParams(location.search).get('business');if(!slug){$('loading').textContent='Missing business link.';return}let {data:b}=await sb.from('businesses').select('id,name').eq('slug',slug).eq('active',true).maybeSingle();if(!b){$('loading').textContent='Business not found.';return}biz=b;let {data:s}=await sb.from('business_services').select('id,name,duration_minutes,price_eur').eq('business_id',b.id).eq('active',true).order('name');services=s||[];$('business').textContent=b.name;$('service').innerHTML=services.map((x,i)=>'<option value="'+i+'">'+x.name+(x.price_eur!=null?' · €'+x.price_eur:'')+'</option>').join('');$('loading').classList.add('hide');$('booking').classList.remove('hide')}
$('send').onclick=async()=>{let s=services[+$('service').value];if(!s||!$('date').value||!$('time').value||!$('name').value.trim()){$('msg').textContent='Please complete service, date, time and name.';return}let starts=new Date($('date').value+'T'+$('time').value);let ends=new Date(starts.getTime()+s.duration_minutes*60000);$('send').disabled=true;$('msg').textContent='Sending…';let {error}=await sb.from('appointments').insert({business_id:biz.id,customer_name:$('name').value.trim(),customer_email:$('email').value.trim()||null,customer_phone:$('phone').value.trim()||null,service:s.name,starts_at:starts.toISOString(),end_at:ends.toISOString(),duration_minutes:s.duration_minutes,status:'new',note:$('note').value.trim()||null});if(error){$('msg').textContent='Could not send appointment. Please try again.';$('send').disabled=false;return}$('booking').classList.add('ok');$('msg').textContent='✓ Appointment request received. The business will confirm it shortly.';$('send').textContent='Sent'}
init();
</script></body></html>
