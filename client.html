<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>LOGO BOSS Client</title><style>:root{--g:#d8ad55;--b:#08090b;--c:#111318;--l:#292c33}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#f6f3eb;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:25px}.login{max-width:430px;margin:10vh auto;background:var(--c);border:1px solid var(--l);border-radius:20px;padding:30px}h1,b{color:var(--g)}input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #363942;background:#17191e;color:white;margin:6px 0}button{background:var(--g);color:#111;font-weight:900;cursor:pointer}.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center}.top button{width:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--c);border:1px solid var(--l);border-radius:15px;padding:17px;margin:12px 0}.nav{display:flex;gap:8px;overflow:auto;margin:20px 0}.nav button{width:auto;white-space:nowrap;background:#17191e;color:#ddd}.nav button.on{background:var(--g);color:#111}.pill{padding:5px 9px;border-radius:20px;background:#29251a;color:#e9c96e;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="login" class="login"><h1>LOGO BOSS</h1><p>Client Dashboard</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><p id="msg"></p></div><main id="app" class="hide"><div class="top"><div><h1 id="biz">LOGO BOSS</h1><span id="pkg" class="pill"></span></div><button id="logout">Log out</button></div><div class="nav"><button class="on" data-tab="home">Dashboard</button><button data-tab="appointments">Appointments</button><button data-tab="leads">Leads</button><button data-tab="modules">AI & Modules</button></div><section id="content"></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://ppmefffjhqpmrjnlewoq.supabase.co','sb_publishable_TcFfVY1GiPZOufw6tQDh1A_vWoS2dsO');let state={b:null,a:[],l:[],m:null};
const $=x=>document.getElementById(x);
async function boot(){let {data:{session}}=await sb.auth.getSession();if(session)load()}
$('loginBtn').onclick=async()=>{ $('msg').textContent='Signing in...';let {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('msg').textContent=error.message;return}load()};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function load(){let {data:ms}=await sb.from('business_members').select('business_id,role').limit(1);if(!ms||!ms.length){$('msg').textContent='No business is assigned to this account.';return}let id=ms[0].business_id;let [b,a,l,m]=await Promise.all([sb.from('businesses').select('*').eq('id',id).single(),sb.from('appointments').select('*').eq('business_id',id).order('created_at',{ascending:false}),sb.from('leads').select('*').eq('business_id',id).order('created_at',{ascending:false}),sb.from('business_modules').select('*').eq('business_id',id).single()]);state={b:b.data,a:a.data||[],l:l.data||[],m:m.data};$('login').classList.add('hide');$('app').classList.remove('hide');$('biz').textContent=state.b.name;$('pkg').textContent=state.b.package;render('home')}
document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>{document.querySelectorAll('.nav button').forEach(y=>y.classList.remove('on'));x.classList.add('on');render(x.dataset.tab)});
function render(t){let c=$('content');if(t==='home')c.innerHTML='<div class="grid"><div class="card"><b>'+state.a.length+'</b><p>Appointments</p></div><div class="card"><b>'+state.l.length+'</b><p>Leads</p></div><div class="card"><b>'+state.b.package+'</b><p>Active package</p></div></div>';if(t==='appointments')c.innerHTML='<h2>Appointments</h2>'+(state.a.length?state.a.map(x=>'<div class="card"><b>'+e(x.customer_name)+'</b><p>'+e(x.service)+' · '+e(x.status)+'</p><small>'+new Date(x.created_at).toLocaleString()+'</small></div>').join(''):'<div class="card">No appointments yet.</div>');if(t==='leads')c.innerHTML='<h2>Leads</h2>'+(state.l.length?state.l.map(x=>'<div class="card"><b>'+e(x.customer_name||'New lead')+'</b><p>'+e(x.email||'')+' '+e(x.phone||'')+'</p><p>'+e(x.message||'')+'</p></div>').join(''):'<div class="card">No leads yet.</div>');if(t==='modules'){let m=state.m||{};let names={website:'Website',booking:'Online booking',ai_chat:'AI Chatbot',email_ai:'AI Email Assistant',review_automation:'Review automation',ai_phone:'AI Phone',advanced_automation:'Advanced automation'};c.innerHTML='<h2>AI & Modules</h2><div class="grid">'+Object.keys(names).map(k=>'<div class="card"><b>'+names[k]+'</b><p>'+(m[k]?'✓ Active':'— Not included')+'</p></div>').join('')+'</div>'}}
function e(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}boot();
</script></body></html>
