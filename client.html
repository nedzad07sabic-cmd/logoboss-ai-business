<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LOGO BOSS Client</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#08090b;color:#f7f5ef;font-family:Arial}.w{max-width:1050px;margin:auto;padding:28px 18px}.gold{color:#d8ad55}.box,.card{background:#111318;border:1px solid #2b2d33;border-radius:16px;padding:20px;margin:12px 0}.login{max-width:430px;margin:12vh auto}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #34363e;margin:6px 0;background:#15171c;color:white}button{background:#d8ad55;color:#111;font-weight:900}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.n{font-size:32px;font-weight:900}.muted{color:#999}.row{display:flex;justify-content:space-between;gap:10px}.row button{width:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div id="login" class="box login"><h1>LOGO <span class="gold">BOSS</span></h1><p>Client Dashboard</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="msg" class="muted"></p></div><div id="app" class="hide"><div class="row"><div><h1 id="businessName">LOGO BOSS</h1><div id="packageName" class="gold"></div></div><button id="logoutBtn">Logout</button></div><div class="grid"><div class="card"><div class="muted">Appointments</div><div class="n" id="appointmentCount">0</div></div><div class="card"><div class="muted">Leads</div><div class="n" id="leadCount">0</div></div><div class="card"><div class="muted">Active modules</div><div class="n" id="moduleCount">0</div></div></div><h2>Modules</h2><div id="modules" class="grid"></div><h2>Latest appointments</h2><div id="appointments"></div><h2>Latest leads</h2><div id="leads"></div></div></div><script>
const sb=supabase.createClient('https://ppmefffjhqpmrjnlewoq.supabase.co','sb_publishable_TcFfVY1GiPZOufw6tQDh1A_vWoS2dsO');
const $=x=>document.getElementById(x), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hide');$('app').classList.add('hide');return}const {data:m}=await sb.from('business_members').select('business_id').limit(1).maybeSingle();if(!m){$('msg').textContent='No business is connected to this account.';return}const bid=m.business_id;const [b,mo,a,l]=await Promise.all([sb.from('businesses').select('*').eq('id',bid).single(),sb.from('business_modules').select('*').eq('business_id',bid).single(),sb.from('appointments').select('*').eq('business_id',bid).order('created_at',{ascending:false}).limit(10),sb.from('leads').select('*').eq('business_id',bid).order('created_at',{ascending:false}).limit(10)]);$('login').classList.add('hide');$('app').classList.remove('hide');$('businessName').textContent=b.data?.name||'Business';$('packageName').textContent=b.data?.package||'';$('appointmentCount').textContent=a.data?.length||0;$('leadCount').textContent=l.data?.length||0;const mods=mo.data||{};const keys=['website','booking','ai_chat','email_ai','review_automation','ai_phone','advanced_automation'];$('moduleCount').textContent=keys.filter(k=>mods[k]).length;$('modules').innerHTML=keys.map(k=>'<div class="card"><b>'+k.replaceAll('_',' ').toUpperCase()+'</b><p class="'+(mods[k]?'gold':'muted')+'">'+(mods[k]?'ACTIVE':'Not included')+'</p></div>').join('');$('appointments').innerHTML=(a.data||[]).map(x=>'<div class="card"><b>'+esc(x.customer_name)+'</b> · '+esc(x.service)+'<p>'+esc(x.status)+' · '+esc(x.starts_at||'Time not set')+'</p></div>').join('')||'<div class="muted">No appointments yet.</div>';$('leads').innerHTML=(l.data||[]).map(x=>'<div class="card"><b>'+esc(x.customer_name||'New lead')+'</b><p>'+esc(x.message||'')+'</p><span class="gold">'+esc(x.status)+'</span></div>').join('')||'<div class="muted">No leads yet.</div>'}
$('loginBtn').onclick=async()=>{ $('msg').textContent='Signing in...';const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('msg').textContent='Login failed.';return}load()};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};load();
</script></body></html>
