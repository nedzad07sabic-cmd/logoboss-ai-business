<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="theme-color" content="#050914"><title>FAQ assistant demo | LogoBoss AI</title><link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest"><link rel="stylesheet" href="/service-pages.css?v=20261009-audit"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div class="wrap"><a class="brand" href="/">LogoBoss AI</a><nav><a href="/ai-assistants.html">AI packages</a></nav></div></header><main class="wrap narrow"><p class="eyebrow">TEXT ASSISTANT DEMO</p><h1 id="brand">FAQ assistant</h1><p>This demonstration uses predefined LogoBoss AI answers. A business assistant needs its own approved content and configuration.</p><div id="chat" class="chat" role="log" aria-live="polite" aria-label="Conversation"></div><form class="chat-row" id="chatForm"><input id="input" aria-label="Your message" placeholder="Write a message…" maxlength="1000" disabled required><button id="send" class="btn" disabled>Send</button></form></main><footer><div class="wrap"><a href="/datenschutz.html">Privacy information</a></div></footer><script>
const sb=supabase.createClient('https://ppmefffjhqpmrjnlewoq.supabase.co','sb_publishable_TcFfVY1GiPZOufw6tQDh1A_vWoS2dsO'),el=id=>document.getElementById(id);let biz=null,cid=null,busy=false;
function add(text,cls){const node=document.createElement('div');node.className='bubble '+cls;node.textContent=text;el('chat').appendChild(node);el('chat').scrollTop=el('chat').scrollHeight}
async function init(){try{const slug=new URLSearchParams(location.search).get('business');if(!slug||slug.length>150)throw Error('A valid business link is required.');const {data,error}=await sb.rpc('lb_public_business',{p_slug:slug,p_module:'ai_chat'});if(error)throw Error('The assistant is temporarily unavailable.');if(!data)throw Error('The assistant is not enabled for this business.');biz=data;el('brand').textContent=data.name+' · FAQ demo';el('input').disabled=false;el('send').disabled=false;add('Hello! You can ask about LogoBoss AI website, text chat and automation packages.','bot')}catch(err){add(err.message||'Could not load the assistant.','bot')}}
el('chatForm').addEventListener('submit',async e=>{e.preventDefault();const message=el('input').value.trim();if(!message||!biz||busy)return;busy=true;el('input').value='';add(message,'me');el('send').disabled=true;try{const r=await fetch('https://ppmefffjhqpmrjnlewoq.supabase.co/functions/v1/ai-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_id:biz.id,conversation_id:cid,message,language:'en'}),signal:AbortSignal.timeout(20000)});const result=await r.json();if(!r.ok||typeof result.reply!=='string')throw Error('The assistant is temporarily unavailable. Please try again later.');cid=result.conversation_id;add(result.reply,'bot')}catch(err){add(err.message||'The assistant is temporarily unavailable.','bot')}finally{busy=false;el('send').disabled=false;el('input').focus()}});init();
</script></body></html>
