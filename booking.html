<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book appointment · LOGO BOSS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090a0c;color:#f5f2ea;font-family:Arial}.w{max-width:650px;margin:40px auto;padding:20px}.card{background:#121419;border:1px solid #2d3037;border-radius:18px;padding:22px}.gold{color:#d8ad55}input,select,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #343740;background:#181a20;color:#fff}button{background:#d8ad55;color:#111;font-weight:900}.ok{padding:20px;border:1px solid #66552d;border-radius:12px;margin-top:15px}</style></head><body><div class="w"><div class="card"><h1 id="title">Book an appointment</h1><p class="gold" id="brand">LOGO BOSS Booking</p><div id="form"><select id="service"><option>Loading services...</option></select><input id="date" type="date"><input id="time" type="time"><input id="name" placeholder="Your name"><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="Phone / WhatsApp"><textarea id="note" placeholder="Message (optional)"></textarea><button id="send">Request appointment</button><p id="msg"></p></div></div></div><script>
const sb=supabase.createClient('https://ppmefffjhqpmrjnlewoq.supabase.co','sb_publishable_TcFfVY1GiPZOufw6tQDh1A_vWoS2dsO'),$=x=>document.getElementById(x);let biz=null,services=[];
async function init(){const slug=new URLSearchParams(location.search).get('business');if(!slug){$('msg').textContent='Business link is missing.';return}let {data,error}=await sb.from('businesses').select('id,name,slug,package').eq('slug',slug).eq('active',true).maybeSingle();if(error||!data){$('msg').textContent='Business not found.';return}biz=data;$('brand').textContent=biz.name;let s=await sb.from('business_services').select('id,name,duration_minutes,price_eur').eq('business_id',biz.id).eq('active',true).order('name');services=s.data||[];$('service').innerHTML=services.length?services.map(x=>'<option value="'+x.id+'">'+x.name+(x.price_eur!=null?' · €'+x.price_eur:'')+'</option>').join(''):'<option value="">General appointment</option>'}
$('send').onclick=async()=>{if(!biz||!$('name').value.trim()||!$('date').value||!$('time').value){$('msg').textContent='Please enter name, date and time.';return}let svc=services.find(x=>x.id===$('service').value);let start=new Date($('date').value+'T'+$('time').value);let duration=svc?.duration_minutes||60;let end=new Date(start.getTime()+duration*60000);$('send').disabled=true;$('msg').textContent='Sending...';let {error}=await sb.from('appointments').insert({business_id:biz.id,customer_name:$('name').value.trim(),customer_email:$('email').value.trim()||null,customer_phone:$('phone').value.trim()||null,service:svc?.name||'General appointment',starts_at:start.toISOString(),end_at:end.toISOString(),duration_minutes:duration,note:$('note').value.trim()||null,status:'new'});if(error){$('msg').textContent='Could not send appointment request.';$('send').disabled=false;return}$('form').innerHTML='<div class="ok"><h2 class="gold">✓ Request received</h2><p>'+biz.name+' has received your appointment request. The appointment is pending confirmation.</p></div>'};init();
</script></body></html>
